name: NovaSparks
description: 'NovaSparks builds ultra-low-latency FPGA market data solutions for banks, trading firms,
  and electronic markets. Its NovaTick ticker plant, delivered as a hardware appliance or PCIe card,
  normalizes and distributes real-time feeds across global equities, options (OPRA), and other asset
  classes with deterministic nanosecond latency. Integration is via a proprietary ultra-low-latency
  C++ Software API and the NovaSparks Wire Format (NSWF), a normalized message protocol whose full
  specification is provided to banks and trading firms under NDA rather than published publicly.
  NovaSparks is now part of Exegy. Surfaced as a portfolio company of Partech.'
